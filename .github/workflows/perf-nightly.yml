name: Pipeline performance benchmark

on:
  schedule:
    # Weekly on Monday 03:00 UTC; the benchmark is not a PR gate.
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  bench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.test.txt
      - name: Run pipeline benchmark
        run: python tools/bench_pipeline.py --count 50 --json-out perf-baseline.json --assert-budget
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-perf
          path: perf-baseline.json
