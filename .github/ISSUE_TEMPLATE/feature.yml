name: 功能建议
description: 提出新功能或改进建议（请先搜索是否已有相同 issue）
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请描述要解决的问题与使用场景，而不是先限定实现方式。
        涉及发票数据时请使用自造的示例数据，**不要粘贴真实发票、授权码或邮箱地址**。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个建议针对什么使用场景或痛点？
      placeholder: 例如：每月需要把同一批发票按项目拆分归档，目前只能手动移动文件
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你希望项目如何表现？如果有多种可选方案，请分别说明
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方案（可选）
      description: 目前如何绕过这个问题？或你考虑过的其他方案
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: 涉及模块
      description: 选择最接近的一个模块
      options:
        - 桌面端界面
        - 邮箱扫描 / IMAP
        - 本地识别 / OCR
        - 链接发票恢复
        - 分类归档 / 规则
        - 命令行入口
        - DeepSeek Harness 插件
        - 文档 / 构建
        - 其他
    validations:
      required: true

  - type: input
    id: frequency
    attributes:
      label: 使用频率与规模（可选）
      description: 例如每天/每月处理多少张发票，便于评估优先级
      placeholder: 例如：每月约 50 张
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息（可选）
      description: 相关截图、参考链接（已脱敏）、对应 issue 编号等
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 issue，确认这不是重复建议
          required: true
        - label: 建议不涉及上传发票内容、凭据或引入遥测
          required: true
